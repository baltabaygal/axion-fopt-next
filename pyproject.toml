[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "axion-fopt-next"
version = "0.1.0"
description = "Solver-independent stochastic cosmological phase-transition geometry"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[tool.setuptools.packages.find]
where = ["src"]
